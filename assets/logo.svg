<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A14" />
      <stop offset="50%" stop-color="#0E1626" />
      <stop offset="100%" stop-color="#04060C" />
    </linearGradient>

    <!-- Document Academic Cyan-to-Amber Gradient -->
    <linearGradient id="doc-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Compiler Execution Pulse -->
    <linearGradient id="exec-pulse" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>

    <linearGradient id="core-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.05" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" rx="160" fill="url(#bg-grad)" />
  <rect width="796" height="796" x="2" y="2" rx="158" fill="none" stroke="#1E293B" stroke-width="2" />

  <!-- Layout Grid Lines (Academic Margin Guides) -->
  <g opacity="0.16" stroke="#38BDF8" stroke-width="1.5">
    <line x1="200" y1="120" x2="200" y2="640" stroke-dasharray="4 8" />
    <line x1="600" y1="120" x2="600" y2="640" stroke-dasharray="4 8" />
    <line x1="120" y1="220" x2="680" y2="220" stroke-dasharray="4 8" />
    <line x1="120" y1="520" x2="680" y2="520" stroke-dasharray="4 8" />
  </g>

  <!-- Stacked Academic Document Pages (Perspective Sheet) -->
  <rect x="250" y="170" width="300" height="400" rx="16" transform="rotate(-6, 400, 370)" fill="#1E293B" opacity="0.4" />
  
  <!-- Main Foreground Document Sheet -->
  <rect x="250" y="160" width="300" height="420" rx="20" fill="#0B132B" stroke="url(#doc-grad)" stroke-width="8" filter="url(#glow)" />

  <!-- Document Header Banner / Question Box -->
  <rect x="280" y="200" width="240" height="32" rx="6" fill="#1E293B" stroke="#38BDF8" stroke-width="2" />
  <text x="300" y="222" font-family="'Times New Roman', serif" font-size="14" font-weight="700" fill="#F8FAFC">
    QUESTION 01: MAIN.C
  </text>

  <!-- Monospace Code Box Inside Document -->
  <rect x="280" y="250" width="240" height="150" rx="8" fill="#060A14" stroke="#334155" stroke-width="2" />
  <g stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" opacity="0.8">
    <line x1="300" y1="275" x2="380" y2="275" />
    <line x1="320" y1="300" x2="480" y2="300" />
    <line x1="320" y1="325" x2="440" y2="325" />
    <line x1="320" y1="350" x2="410" y2="350" />
    <line x1="300" y1="375" x2="330" y2="375" />
  </g>

  <!-- Dual-Column Testcase Execution Matrix -->
  <!-- Testcase 1 (Input Card) -->
  <rect x="280" y="420" width="112" height="70" rx="6" fill="#0E1E24" stroke="#10B981" stroke-width="2" />
  <text x="290" y="440" font-family="'Courier New', monospace" font-size="10" font-weight="700" fill="#10B981">
    INPUT: 15
  </text>
  <text x="290" y="460" font-family="'Courier New', monospace" font-size="9" fill="#94A3B8">
    PASS [2ms]
  </text>

  <!-- Testcase 2 (Output Card) -->
  <rect x="408" y="420" width="112" height="70" rx="6" fill="#1C1814" stroke="#F59E0B" stroke-width="2" />
  <text x="418" y="440" font-family="'Courier New', monospace" font-size="10" font-weight="700" fill="#F59E0B">
    OUT: 130767
  </text>
  <text x="418" y="460" font-family="'Courier New', monospace" font-size="9" fill="#94A3B8">
    EXIT CODE 0
  </text>

  <!-- GCC Compiler Checkmark Badge at Bottom Right -->
  <g filter="url(#subtle-glow)">
    <circle cx="530" cy="560" r="24" fill="#10B981" stroke="#F8FAFC" stroke-width="3" />
    <path d="M 520 560 L 526 568 L 542 550" fill="none" stroke="#F8FAFC" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Typography -->
  <text x="400" y="685" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="800" fill="#F8FAFC" letter-spacing="4">
    LABSHEET<tspan fill="#38BDF8">FORMAT</tspan>
  </text>
  <text x="400" y="722" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#94A3B8" letter-spacing="3">
    AUTOMATED C COMPILER &amp; REPORT SYNTHESIZER
  </text>
</svg>
